services:
  mcp-server:
    build: .
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "${HOST_MCP_PORT:-8000}:8000"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.cache:/app/.cache
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
    # Healthcheck to ensure the container is running correctly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: mcp-admin
    restart: unless-stopped
    ports:
      - "${HOST_ADMIN_PORT:-8081}:8081"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./admin/static:/app/admin/static
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mcp-server:
        condition: service_healthy
